<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <style>
    .logo-font { font-family: 'Inter', sans-serif; fill: white; }
    .title { font-size: 52px; font-weight: 500; letter-spacing: 2px; }
    .subtitle { font-size: 14px; font-weight: 300; letter-spacing: 4px; }
  </style>
  
  <!-- The Square and L -->
  <rect x="10" y="20" width="70" height="70" fill="none" stroke="white" stroke-width="5" />
  <path d="M 30 35 L 30 75 L 65 75" fill="none" stroke="white" stroke-width="5" />
  
  <!-- STUDIO Text -->
  <text x="95" y="75" class="logo-font title">STUDIO</text>
  
  <!-- Subtitle -->
  <text x="98" y="100" class="logo-font subtitle">PREMIUM FAMILY SALON</text>
</svg>
